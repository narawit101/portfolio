  <!-- Circle badge (วงกลม) -->
  <circle cx="16" cy="16" r="14.5" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <!-- Brand text 'cv' -->
  <text x="11.5" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="-0.3">c</text>
  <text x="20.5" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="-0.3">v</text>
</svg>
